# Deploy su Render: New > Blueprint > collega il repository tdpeople/people.
# L'app usa Docker (serve LibreOffice per i PDF): il primo build richiede alcuni minuti.
services:
  - type: web
    name: td-contracts
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BASE_URL
        value: https://contracts.toscanadiagnostica.it   # dominio ufficiale: gli altri host vengono reindirizzati qui
      - key: DATABASE_URL
        fromDatabase:
          name: td-contracts-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: "10"
      - key: REQUIRE_TOTP_FOR_ADMINS
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PACK_MB
        value: "600"
      - key: SEED_ADMIN_EMAIL
        value: francesco.epifani@toscanadiagnostica.it
      - key: SEED_ADMIN_NAME
        value: Francesco Epifani
      - key: SEED_ADMIN_PASSWORD
        sync: false   # inserire a mano nel pannello (min 12 caratteri): richiesta al primo accesso, poi da cambiare
      - key: ENTRA_TENANT_ID
        sync: false   # gestite nel pannello Render: il Sync del Blueprint non le sovrascrive
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false   # facoltativa: sintesi automatica dei CV nel CV Box
databases:
  - name: td-contracts-db
    plan: basic-1gb      # i dossier (PDF, scansioni) sono salvati nel database: 16 GB di storage
    region: frankfurt
    databaseName: contracts
    user: contracts
