services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contracts
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: ${DB_PASSWORD:?imposta DB_PASSWORD nel file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://contracts:${DB_PASSWORD}@db:5432/contracts
      SESSION_SECRET: ${SESSION_SECRET:?imposta SESSION_SECRET nel file .env}
      REQUIRE_TOTP_FOR_ADMINS: ${REQUIRE_TOTP_FOR_ADMINS:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Amministratore}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment: { PGPASSWORD: "${DB_PASSWORD}" }
    volumes: ["./backup:/backup"]
    entrypoint: >
      sh -c 'while true; do pg_dump -h db -U contracts -d contracts -Fc -f /backup/contracts_$(date +%%Y%%m%%d_%%H%%M).dump && find /backup -name "contracts_*.dump" -mtime +30 -delete; sleep 86400; done'
volumes:
  pgdata:
